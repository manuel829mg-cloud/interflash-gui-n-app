<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="INTER Flash">
  <defs>
    <linearGradient id="g" x1="18" y1="16" x2="74" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#59c8ff"/>
      <stop offset="0.5" stop-color="#168cff"/>
      <stop offset="1" stop-color="#0458c8"/>
    </linearGradient>
    <linearGradient id="ring" x1="14" y1="22" x2="82" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#dff4ff"/>
      <stop offset="1" stop-color="#8fd7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#001b3a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- globe -->
  <g filter="url(#shadow)">
    <circle cx="46" cy="51" r="27" fill="url(#g)"/>
    <circle cx="46" cy="51" r="27" fill="none" stroke="#0b4f9f" stroke-width="1.2" opacity="0.8"/>

    <!-- longitude / latitude -->
    <path d="M19 51h54M22 39h48M22 63h48" fill="none" stroke="#8ad6ff" stroke-width="3.2" stroke-linecap="round" opacity="0.95"/>
    <path d="M46 24c-8 8-12 17-12 27s4 19 12 27M46 24c8 8 12 17 12 27s-4 19-12 27" fill="none" stroke="#8ad6ff" stroke-width="3.2" stroke-linecap="round" opacity="0.95"/>

    <!-- orbit rings -->
    <path d="M13 50c5-17 23-31 45-32 10 0 19 2 26 6-9-2-19-2-29 0-21 4-37 15-42 26z" fill="url(#ring)"/>
    <path d="M10 58c9 13 28 21 49 17 13-2 24-8 31-16-7 13-20 23-36 26-21 4-39-5-44-27z" fill="#168cff" opacity="0.98"/>
    <path d="M15 65c10 8 24 12 39 9 18-3 32-13 38-24-4 17-19 31-38 35-17 3-32-3-39-20z" fill="#0b66d8" opacity="0.96"/>
  </g>

  <!-- digital spark -->
  <g fill="#33b8ff">
    <rect x="69" y="15" width="8" height="8" rx="1.4"/>
    <rect x="80" y="23" width="6" height="6" rx="1.2"/>
    <rect x="67" y="27" width="6" height="6" rx="1.2"/>
    <rect x="77" y="34" width="5" height="5" rx="1"/>
    <rect x="85" y="34" width="4" height="4" rx="1"/>
  </g>
</svg>
