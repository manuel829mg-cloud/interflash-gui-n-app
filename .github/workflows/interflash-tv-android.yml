name: Build Inter Flash TV test APK
on:
  workflow_dispatch:
  push:
    branches: [feature/interflash-tv]
    paths:
      - 'interflash-tv-android/**'
      - '.github/workflows/interflash-tv-android.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interflash-tv-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: InterFlashTV-debug
          path: interflash-tv-android/app/build/outputs/apk/debug/app-debug.apk
