name: Inter Flash TV 0.57 APK
on:
  push:
    branches: ['build/interflash-tv-v057-native']
    paths: ['native-v057/READY', '.github/workflows/interflash-v057.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore exact native sources
        run: |
          cat native-v057/source.part*.b64 | base64 -d > /tmp/native.tar.xz
          mkdir native-source
          tar -xJf /tmp/native.tar.xz -C native-source
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-36" "build-tools;36.0.0"
      - name: Use available Android 36 compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path("native-source").rglob("build.gradle.kts"):
              text = p.read_text()
              if "release(37)" in text:
                  p.write_text(text.replace("release(37)", "release(36)"))
                  print("Compile SDK 36:", p)
          PY
      - name: Compile native 0.57
        working-directory: native-source/InterFlashTV-OwnTV
        env:
          VERSION_CODE: '57'
          VERSION_NAME: 0.57-ver-catalogo
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardRelease -Powntv.corePath=../OwnTV_Core-main -Pkotlin.compiler.execution.strategy=in-process --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:ActiveProcessorCount=2"
      - uses: actions/upload-artifact@v4
        with:
          name: InterFlashTV-v0.57-UNSIGNED
          path: native-source/InterFlashTV-OwnTV/app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: error
