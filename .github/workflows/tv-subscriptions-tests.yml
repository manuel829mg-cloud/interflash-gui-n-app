name: Inter Flash TV isolated billing tests
on:
  pull_request:
    paths:
      - "isp-manager-new/tv_subscription*.py"
      - "isp-manager-new/test_tv_*.py"
      - "isp-manager-new/isp_tv_native.py"
      - "isp-manager-new/wsgi.py"
      - ".github/workflows/tv-subscriptions-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tv-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run isolated subscription tests
        working-directory: isp-manager-new
        run: |
          python -m py_compile isp_tv_native.py wsgi.py tv_subscriptions_isolated.py tv_subscription_reconcile.py tv_subscription_admin_staging.py
          python -m unittest -v test_tv_subscriptions_isolated test_tv_subscription_reconcile test_tv_reconnection_safety
