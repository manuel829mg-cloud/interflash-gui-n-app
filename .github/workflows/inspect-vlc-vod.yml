name: Inspect stable VOD target code
on:
  push:
    branches: ['feature/vlc-vod-stable-update']
    paths: ['.github/workflows/inspect-vlc-vod.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect playback entry-points
        run: |
          cat native-v057/source.part*.b64 | base64 -d > /tmp/native.tar.xz
          mkdir -p native-source
          tar -xJf /tmp/native.tar.xz -C native-source
          python3 - <<'PY' > docs/vlc-vod-targets.txt
          from pathlib import Path
          base=Path('native-source/InterFlashTV-OwnTV')
          java='app/src/main/java/tv/own/owntv/features/'
          paths={
             java+'movies/MovieViewModel.kt':[(1,155),(625,780)],
             java+'series/SeriesViewModel.kt':[(1,130),(960,1125)],
             java+'movies/MoviesScreen.kt':[(215,285),(400,510),(680,800),(950,975)],
             java+'series/SeriesScreen.kt':[(1372,1410),(1480,1530),(1710,1760),(1910,1925)],
             'app/src/main/AndroidManifest.xml':[(1,190)],
             'app/build.gradle.kts':[(1,115),(275,350)],
          }
          for rel,ranges in paths.items():
             p=base/rel
             if not p.exists():continue
             rows=p.read_text().splitlines()
             print('====',rel,'====')
             for a,b in ranges:
               print('---',a,b,'---')
               for i in range(a-1,min(b,len(rows))):print(f'{i+1:4d} {rows[i]}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/vlc-vod-targets.txt
          git commit -m 'Inspect stable VOD playback method bodies' || true
          git push
