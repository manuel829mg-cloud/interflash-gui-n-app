name: Inspect numeric channel routing
on:
  push:
    branches: ['feature/interflash-tv-numeric-remote-20261126']
    paths: ['.github/workflows/inspect-numeric-channel-routing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect native channel selection APIs
        run: |
          cat native-v057/source.part*.b64 | base64 -d > /tmp/native.tar.xz
          mkdir native-source
          tar -xJf /tmp/native.tar.xz -C native-source
          app=native-source/InterFlashTV-OwnTV/app/src/main/java/tv/own/owntv
          find "$app" -iname '*live*' -o -iname '*shell*'
          grep -RnEi 'dominican|dominicano|channelNumber|tuneByNumber|channelByNumber|KEYCODE_[0-9]|Key\.NumPad|Key\.Zero' "$app" | cut -c1-400 | head -200 || true
          find "$app" -name '*Live*ViewModel.kt' -exec sh -c 'echo "$1"; grep -nE "fun |val .*Flow|val .*State" "$1" | head -180' sh {} \;
          grep -nE 'liveVm|MainSection.LIVE_TV|onFullscreen|fun OwnTVShell' "$app/features/shell/OwnTVShell.kt" | head -150 || true
          echo '=== tune implementation ==='
          sed -n '1350,1485p' "$app/features/live/LiveViewModel.kt"
          cat "$app/player/DirectTune.kt"
          cat "$app/player/PlayerChannelKeys.kt"
          echo '=== channel number assignment and settings ==='
          grep -RnEi --include='*.kt' 'isDominicanFolder|dominicanChannel|dominicanNumber|numberKeysTune|directTune.*(default|false|true)|fun .*ChannelNumber' native-source | cut -c1-420 | head -180 || true
