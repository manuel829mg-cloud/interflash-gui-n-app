name: Inspect Native Android TV Key Handling
on:
  push:
    branches: [feature/interflash-tv-tech-ok10-20261126]
    paths: [.github/workflows/inspect-key-handling.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate main activity and key handling
        shell: bash
        run: |
          cat native-v057/source.part*.b64 | base64 -d > /tmp/native.tar.xz
          mkdir -p native-source
          tar -xJf /tmp/native.tar.xz -C native-source
          echo "=== ACTIVITY FILES ==="
          find native-source/InterFlashTV-OwnTV/app/src/main -iname '*Activity*' | head -60
          echo "=== ANDROID MANIFEST ==="
          grep -nE 'activity|MAIN|LAUNCHER|android:name=' native-source/InterFlashTV-OwnTV/app/src/main/AndroidManifest.xml | head -100
          echo "=== GLOBAL KEY HANDLERS ==="
          grep -Rnl -E 'dispatchKeyEvent|onKeyDown|onKeyUp|onKeyLongPress|KEYCODE_DPAD_CENTER|KEYCODE_ENTER|Key\.Enter|Key\.DirectionCenter' native-source/InterFlashTV-OwnTV/app/src/main/java | head -100
          echo "=== MAINACTIVITY HEAD ==="
          m=native-source/InterFlashTV-OwnTV/app/src/main/java/tv/own/owntv/MainActivity.kt
          echo '=== MAINACTIVITY METHODS ==='
          grep -nE 'override fun (onCreate|onResume|onPause|onDestroy|dispatchKeyEvent|onKeyDown|onKeyUp)|fun .*launch|class MainActivity' "$m" | head -70
          echo '=== MAINACTIVITY 90-360 ==='
          sed -n '90,360p' "$m"
          echo '=== PLAYER OK PRESS ==='
          cat native-source/InterFlashTV-OwnTV/app/src/main/java/tv/own/owntv/player/PlayerOkPress.kt
          echo '=== PLAYER HUD OK references ==='
          grep -n -C 12 -E 'KEYCODE_DPAD_CENTER|Key.DirectionCenter|Key.Enter|onKeyEvent|dispatchKeyEvent|detectTapGestures|longPress' native-source/InterFlashTV-OwnTV/app/src/main/java/tv/own/owntv/player/PlayerHud.kt | head -250
          echo '=== SHELL OK references ==='
          grep -n -C 7 -E 'Key.DirectionCenter|Key.Enter|onKeyEvent|KEYCODE_DPAD_CENTER|longPress' native-source/InterFlashTV-OwnTV/app/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt | head -190
