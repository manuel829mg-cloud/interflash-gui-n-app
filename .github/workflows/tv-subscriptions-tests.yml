name: Inter Flash TV isolated billing tests
on:
  pull_request:
    paths:
      - "isp-manager-new/tv_subscription*.py"
      - "isp-manager-new/test_tv_*.py"
      - ".github/workflows/tv-subscriptions-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tv-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run isolated subscription tests
        working-directory: isp-manager-new
        run: |
          python -m unittest -v test_tv_subscriptions_isolated test_tv_subscription_reconcile test_tv_reconnection_safety
