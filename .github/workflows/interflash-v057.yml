          from pathlib import Path
          root = Path("native-source/InterFlashTV-OwnTV/app/src/main/java/tv/own/owntv/features")
          def replace(path, old, new):
              source = path.read_text()
              if source.count(old) != 1:
                  raise ValueError(f"Unexpected source in {path}: {old}")
              path.write_text(source.replace(old, new))
          rows = root / "shell/components/CinemaCategoryRows.kt"
          replace(rows, "minOf(480.mpx, maxWidth)", "minOf(640.mpx, maxWidth)")
          replace(rows, "val posterWidth = 144.mpx", "val posterWidth = 184.mpx")
          replace(rows, "minOf(152.mpx,", "minOf(192.mpx,")
          replace(rows, "if (selected) 270.mpx else 214.mpx", "if (selected) 360.mpx else 276.mpx")
          shell = root / "shell/OwnTVShell.kt"
          replace(shell, "top = if (classicVod) 94.mpx else if (clientMode) 112.mpx else 0.dp,", 
              "top = if (clientMode && selectedSection == MainSection.SERIES) 80.mpx else if (classicVod) 94.mpx else if (clientMode) 112.mpx else 0.dp,")
          rail = root / "shell/components/StageRail.kt"
          replace(rail, "modifier.fillMaxWidth().padding(top = 20.mpx).height(72.mpx)", 
              "modifier.fillMaxWidth().padding(top = if (selected == MainSection.SERIES) 8.mpx else 20.mpx).height(72.mpx)")
          PY
      - name: Classify non-display catalogue literals
        working-directory: native-source/InterFlashTV-OwnTV
        run: |
          python3 - <<'PY'
          import subprocess
          base = 'app/src/main/java/tv/own/owntv/features/'
          for path, text, category in [
              ('movies/MoviesScreen.kt', '', 'empty'),
              ('series/SeriesScreen.kt', '', 'empty'),
              ('shell/components/CinemaCategoryRows.kt', 'https://image.tmdb.org/t/p/', 'url'),
              ('shell/components/CinemaCategoryRows.kt', '/w[0-9]+/', 'regex'),
              ('shell/components/CinemaCategoryRows.kt', '/original/', 'uri'),
          ]:
              subprocess.run(['python3', 'tools/i18n/check_hardcoded_strings.py', 'classify-safe', '--path', base + path, '--text', text, '--category', category], check=True)
          PY
          python3 tools/i18n/check_hardcoded_strings.py verify --bootstrap
      # Rollback: keep the stable native player for Movies and Series.
      # Do NOT apply native-v057/vlc-vod-only.py: it caused black-screen reports in 0.68.
      - name: Add hidden technician PIN on 10-second OK hold
        run: python3 native-v057/interflash-tech-ok10.py
      - name: Apply Dominican broadcast number shortcuts
        run: python3 native-v057/interflash-dominican-numbers.py
      - name: Configure ZTE remote shortcut learning
        run: python3 native-v057/interflash-zte-shortcuts.py
      - name: List available SDK platforms
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list | grep -E "platforms;android-3[67]"'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - name: Compile stable-package update with original VOD player
        working-directory: native-source/InterFlashTV-OwnTV
        env:
          VERSION_CODE: '78'
          VERSION_NAME: '0.78'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardRelease -Powntv.corePath=../OwnTV_Core-main -Pkotlin.compiler.execution.strategy=in-process --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:ActiveProcessorCount=2"
      - name: Sign installable APK for testing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.INTERFLASH_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.INTERFLASH_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.INTERFLASH_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.INTERFLASH_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK_DIR="native-source/InterFlashTV-OwnTV/app/build/outputs/apk/standard/release"
          APK=$(find "$APK_DIR" -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          mkdir -p /tmp/interflash-signing
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/interflash-signing/release.jks
            STORE=/tmp/interflash-signing/release.jks
            STORE_PASS="$KEYSTORE_PASSWORD"
            PASS="$KEY_PASSWORD"
            ALIAS="$KEY_ALIAS"
          else
            echo "::warning::No persistent signing secrets configured. Generating a temporary test key; reinstall may be required for future updates."
            STORE=/tmp/interflash-signing/test.jks
            STORE_PASS="testonly123456"
            PASS="testonly123456"
            ALIAS="interflash-test"
            keytool -genkeypair -keystore "$STORE" -storepass "$STORE_PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Inter Flash TV Test, O=Inter Flash, C=DO" -noprompt
          fi
          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$SDK_BUILD_TOOLS/zipalign" -f -p 4 "$APK" /tmp/interflash-signing/aligned.apk
          "$SDK_BUILD_TOOLS/apksigner" sign --ks "$STORE" --ks-key-alias "$ALIAS" --ks-pass "pass:$STORE_PASS" --key-pass "pass:$PASS" --out "$APK_DIR/InterFlashTV-v0.78-INSTALABLE.apk" /tmp/interflash-signing/aligned.apk
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose "$APK_DIR/InterFlashTV-v0.78-INSTALABLE.apk"
          rm -f "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: InterFlashTV-v0.78-INSTALABLE-MENU
          path: native-source/InterFlashTV-OwnTV/app/build/outputs/apk/standard/release/InterFlashTV-v0.78-INSTALABLE.apk
          if-no-files-found: error
