name: Inspect live-only kiosk implementation
on:
  push:
    branches: [feature/interflash-tv-kiosk-live-20261126]
    paths: [.github/workflows/inspect-key-handling.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original live player and startup routes
        run: |
          cat native-v057/source.part*.b64 | base64 -d > /tmp/native.tar.xz
          mkdir native-source
          tar -xJf /tmp/native.tar.xz -C native-source
          cd native-source/InterFlashTV-OwnTV/app/src/main
          p=java/tv/own/owntv
          echo "=== MANIFEST ==="
          cat AndroidManifest.xml
          echo "=== SHELL STARTUP AND PLAYER ==="
          grep -n -C 9 -Ei 'startup|PlayerMode.FULL|BackHandler|channelList|onFullscreen|onExitPlayer|selectedSection' "$p/features/shell/OwnTVShell.kt" | head -n 900
          echo "=== HUD ==="
          grep -n -C 8 -Ei 'channelList|PlayerOk|BackHandler|Key.Back|DirectionUp|DirectionDown|DirectionLeft|DirectionRight' "$p/player/PlayerHud.kt" | head -n 600
          echo "=== MAIN ACTIVITY SHELL ==="
          grep -n -C 8 'OwnTVShell(' "$p/MainActivity.kt"
          echo "=== PLAYER CALLBACKS ==="
          sed -n '1670,1910p' "$p/features/shell/OwnTVShell.kt"
          echo "=== LIVE VM METHODS ==="
          find "$p" -iname "*LiveViewModel*"
          grep -n -Ei "fun .*channel|val .*channel|paging" "$p/features/live/LiveViewModel.kt" | head -n 200
          echo "=== ADMIN ==="
          grep -Rnl -E 'DeviceAdminReceiver|startLockTask|setLockTaskPackages' "$p" || true
