name: Inter Flash Inicio Seguro - Android TV Launcher
on:
  push:
    branches:
      - feature/interflash-home-delay30
    paths:
      - .github/workflows/interflash-home-delay30.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 "platforms;android-35" "build-tools;35.0.0"
      - name: Generate isolated startup launcher project
        run: |
          mkdir -p delayed-home/app/src/main/java/com/interflash/home
          cat > delayed-home/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'InterFlashInicioSeguro'
          include ':app'
          EOF
          cat > delayed-home/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > delayed-home/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > delayed-home/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.interflash.home'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.interflash.home'
                  minSdk 23
                  targetSdk 32
                  versionCode 4
                  versionName '1.3'
              }
          }
          EOF
          cat > delayed-home/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <queries><package android:name="com.interflash.tv.player" /></queries>
              <application android:allowBackup="false" android:label="Inter Flash Inicio Seguro"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:launchMode="singleTask" android:excludeFromRecents="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".TechActivity" android:exported="true"
                      android:label="Inter Flash Soporte"
                      android:excludeFromRecents="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > delayed-home/app/src/main/java/com/interflash/home/MainActivity.java <<'EOF'
          package com.interflash.home;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
                    import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /**
           * Optional Android TV HOME replacement: starts the existing installed
           * Inter Flash TV from the foreground, after waiting for validated internet.
           * Does not disable any other launcher, modify user data, or lock the device.
           */
          public final class MainActivity extends Activity {
              private static final String TARGET = "com.interflash.tv.player";
              private static final long INITIAL_DELAY_MS = 2_000L;
              private static final long NETWORK_STABLE_MS = 0L;
              private static final long NETWORK_WAIT_LIMIT_MS = 120_000L;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Runnable update = new Runnable() {
                  @Override public void run() { tick(); }
              };
              private long since;
              private long networkReadySince;
              private boolean started;
              private TextView status;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(android.view.Gravity.CENTER);
                  layout.setPadding(60, 36, 60, 36);
                  layout.setBackgroundColor(Color.rgb(11, 19, 30));

                  TextView title = new TextView(this);
                  title.setText("INTER FLASH TV");
                  title.setTextSize(32);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(android.view.Gravity.CENTER);
                  title.setTextColor(Color.WHITE);
                  layout.addView(title, new LinearLayout.LayoutParams(-1, -2));

                  status = new TextView(this);
                  status.setTextColor(Color.LTGRAY);
                  status.setTextSize(19);
                  status.setGravity(android.view.Gravity.CENTER);
                  status.setPadding(0, 28, 0, 28);
                  layout.addView(status, new LinearLayout.LayoutParams(-1, -2));

                  Button open = new Button(this);
                  open.setText("Abrir Inter Flash TV ahora");
                  open.setOnClickListener(v -> openTV());
                  layout.addView(open, new LinearLayout.LayoutParams(430, -2));

                  TextView hint = new TextView(this);
                  hint.setText("Inter Flash, siempre conectado contigo.");
                  hint.setTextColor(Color.GRAY);
                  hint.setTextSize(14);
                  hint.setGravity(android.view.Gravity.CENTER);
                  hint.setPadding(0, 22, 0, 0);
                  layout.addView(hint, new LinearLayout.LayoutParams(-1, -2));

                  setContentView(layout);
                  open.requestFocus();
              }

              @Override protected void onResume() {
                  super.onResume();
                  since = SystemClock.elapsedRealtime();
                  networkReadySince = 0;
                  started = false;
                  handler.removeCallbacks(update);
                  handler.post(update);
              }

              @Override protected void onPause() {
                  handler.removeCallbacks(update);
                  super.onPause();
              }

              private boolean readyInternet() {
                  try {
                      ConnectivityManager manager =
                          (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                      Network active = manager.getActiveNetwork();
                      if (active == null) return false;
                      NetworkCapabilities caps = manager.getNetworkCapabilities(active);
                      return caps != null &&
                          caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET) &&
                          caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED);
                  } catch (Exception ignored) { return false; }
              }

              private void tick() {
                  if (started || isFinishing()) return;
                  long now = SystemClock.elapsedRealtime();
                  long waited = now - since;
                  if (waited < INITIAL_DELAY_MS) {
                      long seconds = (INITIAL_DELAY_MS - waited + 999) / 1000;
                      status.setText("Preparando Android... " + seconds + " s");
                  } else if (readyInternet()) {
                      if (networkReadySince == 0) networkReadySince = now;
                      if (now - networkReadySince >= NETWORK_STABLE_MS) {
                          openTV();
                          return;
                      }
                      status.setText("Internet detectado. Comprobando estabilidad...");
                  } else {
                      networkReadySince = 0;
                      if (waited >= NETWORK_WAIT_LIMIT_MS) {
                          status.setText("Internet aún no está listo. Pulsa Abrir Inter Flash TV cuando funcione.");
                          return;
                      }
                      status.setText("Esperando conexión a Internet...");
                  }
                  handler.postDelayed(update, 1000L);
              }

              private void openTV() {
                  if (started) return;
                  Intent intent = getPackageManager().getLaunchIntentForPackage(TARGET);
                  if (intent == null) {
                      status.setText("Inter Flash TV no está instalada. Instálala para continuar.");
                      return;
                  }
                  try {
                      started = true;
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                      startActivity(intent);
                  } catch (Exception e) {
                      started = false;
                      status.setText("No se pudo abrir Inter Flash TV. Pulsa Abrir para reintentar.");
                  }
              }
          }
          EOF
          cat > delayed-home/app/src/main/java/com/interflash/home/TechActivity.java <<'EOF'
          package com.interflash.home;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.widget.Button;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /**
           * Technician-only route, separate from the automatic HOME startup screen.
           * This PIN gates buttons in our app, not the Android system Settings UI.
           */
          public final class TechActivity extends Activity {
              private final StringBuilder typed = new StringBuilder();
              private TextView pinDisplay;
              private TextView message;
              private GridLayout keypad;
              private LinearLayout authenticatedActions;
              private boolean authorized = false;
              private Button firstNumber;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(50, 25, 50, 25);
                  root.setBackgroundColor(Color.rgb(11, 19, 30));

                  TextView heading = new TextView(this);
                  heading.setText("INTER FLASH - ACCESO TÉCNICO");
                  heading.setTextColor(Color.WHITE);
                  heading.setTextSize(26);
                  heading.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  heading.setGravity(Gravity.CENTER);
                  root.addView(heading, new LinearLayout.LayoutParams(-1, -2));

                  pinDisplay = new TextView(this);
                  pinDisplay.setTextColor(Color.WHITE);
                  pinDisplay.setTextSize(32);
                  pinDisplay.setGravity(Gravity.CENTER);
                  pinDisplay.setPadding(0, 18, 0, 6);
                  root.addView(pinDisplay, new LinearLayout.LayoutParams(-1, -2));

                  message = new TextView(this);
                  message.setTextColor(Color.LTGRAY);
                  message.setTextSize(16);
                  message.setGravity(Gravity.CENTER);
                  root.addView(message, new LinearLayout.LayoutParams(-1, -2));

                  keypad = new GridLayout(this);
                  keypad.setColumnCount(3);
                  String[] keys = {"1","2","3","4","5","6","7","8","9","Borrar","0","Salir"};
                  for (String key : keys) {
                      Button b = new Button(this);
                      b.setText(key);
                      b.setTextSize(21);
                      GridLayout.LayoutParams lp = new GridLayout.LayoutParams();
                      lp.width = 174;
                      lp.height = 70;
                      lp.setMargins(5, 5, 5, 5);
                      if ("Borrar".equals(key)) b.setOnClickListener(v -> eraseDigit());
                      else if ("Salir".equals(key)) b.setOnClickListener(v -> finish());
                      else b.setOnClickListener(v -> enterDigit(key));
                      keypad.addView(b, lp);
                      if (firstNumber == null) firstNumber = b;
                  }
                  root.addView(keypad);

                  authenticatedActions = new LinearLayout(this);
                  authenticatedActions.setOrientation(LinearLayout.VERTICAL);
                  authenticatedActions.setGravity(Gravity.CENTER);

                  Button settings = new Button(this);
                  settings.setText("Abrir ajustes de Android");
                  settings.setOnClickListener(v -> {
                      if (!authorized) return;
                      openSettings(new Intent(Settings.ACTION_SETTINGS));
                  });
                  authenticatedActions.addView(settings, new LinearLayout.LayoutParams(460, -2));

                  Button home = new Button(this);
                  home.setText("Elegir aplicación de inicio");
                  home.setOnClickListener(v -> {
                      if (!authorized) return;
                      openSettings(new Intent(Settings.ACTION_HOME_SETTINGS));
                  });
                  authenticatedActions.addView(home, new LinearLayout.LayoutParams(460, -2));

                  Button exit = new Button(this);
                  exit.setText("Salir del modo técnico");
                  exit.setOnClickListener(v -> finish());
                  authenticatedActions.addView(exit, new LinearLayout.LayoutParams(460, -2));

                  authenticatedActions.setVisibility(View.GONE);
                  root.addView(authenticatedActions);
                  setContentView(root);
                  showPin();
                  firstNumber.requestFocus();
              }

              private void openSettings(Intent preferred) {
                  try {
                      startActivity(preferred);
                  } catch (Exception e) {
                      try { startActivity(new Intent(Settings.ACTION_SETTINGS)); }
                      catch (Exception ignored) { }
                  }
                  finish();
              }

              private void showPin() {
                  StringBuilder stars = new StringBuilder();
                  for (int i = 0; i < typed.length(); i++) stars.append("● ");
                  for (int i = typed.length(); i < 4; i++) stars.append("○ ");
                  pinDisplay.setText(stars.toString());
                  message.setText("Introduce el PIN del técnico.");
              }

              private void eraseDigit() {
                  if (authorized) return;
                  if (typed.length() > 0) typed.deleteCharAt(typed.length() - 1);
                  showPin();
              }

              private void enterDigit(String digit) {
                  if (authorized || typed.length() >= 4) return;
                  typed.append(digit);
                  if (typed.length() == 4) {
                      if ("8888".contentEquals(typed)) {
                          authorized = true;
                          keypad.setVisibility(View.GONE);
                          authenticatedActions.setVisibility(View.VISIBLE);
                          pinDisplay.setText("Acceso autorizado");
                          message.setText("Opciones reservadas para técnicos.");
                          authenticatedActions.getChildAt(0).requestFocus();
                      } else {
                          typed.setLength(0);
                          showPin();
                          message.setText("PIN incorrecto. Inténtalo de nuevo.");
                      }
                  } else showPin();
              }

              @Override public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (!authorized && keyCode >= KeyEvent.KEYCODE_0 && keyCode <= KeyEvent.KEYCODE_9) {
                      enterDigit(String.valueOf(keyCode - KeyEvent.KEYCODE_0));
                      return true;
                  }
                  if (!authorized && keyCode == KeyEvent.KEYCODE_DEL) {
                      eraseDigit();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF
      - name: Build installer
        working-directory: delayed-home
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: InterFlash-Inicio-2s-PIN8888-APK
          path: delayed-home/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
